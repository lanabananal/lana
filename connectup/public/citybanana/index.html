<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/citybanana/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E0836">
<title>City Banana</title>
<link rel="icon" href="symbol.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script>/* follow the system theme; .dk also forces dark on the map and detail screens */
(()=>{const q=matchMedia('(prefers-color-scheme: dark)'),f=()=>document.documentElement.classList.toggle('dk',q.matches);f();q.addEventListener('change',f)})();</script>
<style>
:root{--night:#1E0836;--ame:#3D0F6B;--vio:#6A1FA8;--orc:#C47CE8;--gold:#E4A826;--ogold:#B07D12;--cream:#FFF5DA;--mist:#E9DDF5;
 --bg:var(--cream);--card:#fff;--line:var(--mist);--chipbg:#fff;--chipline:var(--mist);--daybg:var(--mist);--tb:var(--ame);--tx:var(--night);--tx2:#4B3A63;
 --nav:var(--cream);--navtx:#6B5683;--navon:var(--ame);--navline:var(--mist);--acc:var(--ame);--app:min(100vw,430px);--ttl:'Cinzel',Georgia,serif;color-scheme:light}
.dk{--bg:#2A0A4A;--card:#3D0F6B;--line:rgba(228,168,38,.22);--chipbg:#3D0F6B;--chipline:rgba(228,168,38,.4);--daybg:#3D0F6B;--tb:var(--night);--tx:var(--cream);--tx2:#CDB8E6;
 --nav:var(--night);--navtx:#CDB8E6;--navon:var(--gold);--navline:rgba(228,168,38,.25);--acc:var(--gold);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night)}
body{font:16px/1.5 'Lora',Georgia,serif;color:var(--tx)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);color:var(--tx);padding:0 16px calc(104px + env(safe-area-inset-bottom))}
svg.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:calc(16px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header .ht{flex:1;min-width:0}
header h1{margin:0;font:600 26px/1.18 var(--ttl);letter-spacing:.02em;text-wrap:balance}
header .sub{color:var(--tx2)}
.hicon{width:48px;height:48px;flex:none;object-fit:contain}
.lang{width:44px;height:44px;flex:none;border-radius:22px;border:1.5px solid var(--chipline);background:var(--chipbg);font:700 13px var(--ttl);letter-spacing:.08em}
h2{font:700 13px 'Lora',Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:22px 4px 10px}
.joke{text-align:center;color:var(--tx2);font-style:italic;margin:24px 0 8px}
.empty{text-align:center;padding:24px 12px;color:var(--tx2);font-size:18px}
/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.day{flex:0 0 48px;height:68px;border-radius:18px;background:var(--daybg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--ttl);color:var(--tx)}
.day small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.day b{font-size:20px;font-weight:700;line-height:1}
.day.on{background:var(--gold);color:var(--night)}
/* search + chips */
.search{position:relative;margin:8px 0 10px}
.search svg{position:absolute;left:18px;top:15px;width:22px;height:22px;color:var(--gold)}
.search input{width:100%;height:52px;border-radius:26px;border:1.5px solid var(--gold);background:var(--chipbg);color:var(--tx);padding:0 18px 0 52px;font-size:16px;outline:none}
.search input::placeholder{color:var(--tx2);opacity:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.chip{flex:none;height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--chipline);background:var(--chipbg);color:var(--tx);font:600 15px 'Lora',Georgia,serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:700}
.chip svg{width:18px;height:18px}
/* cards */
.card{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:12px;border-radius:24px;background:var(--card);border:2px solid var(--line);width:100%;text-align:left;color:var(--tx)}
.tb{flex:0 0 68px;height:68px;border-radius:18px;background:var(--tb);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--ttl)}
.tb b{color:var(--gold);font-size:20px;font-weight:700;line-height:1.15}.tb b.sm{font-size:14px}
.tb small{color:var(--cream);font-size:12px;font-weight:600;letter-spacing:.06em}
.tb svg{width:30px;height:30px;color:var(--gold)}
.cb{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.cb .ct{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.cb p{margin:0;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font:700 12px 'Lora',Georgia,serif;border:1.5px solid var(--chipline);color:var(--tx2)}
.pill.free{background:var(--gold);border-color:var(--gold);color:var(--night)}
.pill.live{background:var(--orc);border-color:var(--orc);color:var(--night)}
.pill.live:before{content:'';width:6px;height:6px;border-radius:3px;background:var(--night)}
.pill.tix{background:var(--vio);border-color:var(--vio);color:var(--cream)}
.pill.new{background:var(--mist);border-color:var(--mist);color:var(--ame)}
.pill.out{border-color:var(--tx);color:var(--tx)}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:var(--app);height:calc(80px + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);background:var(--nav);display:flex;z-index:20;border-top:1px solid var(--navline)}
.nav button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--navtx);font:500 12px 'Lora',Georgia,serif}
.nav svg{width:24px;height:24px}
.nav .on{color:var(--navon);font-weight:700}
/* filter sheet */
.veil{position:fixed;inset:0;background:#1E083699;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:var(--app);max-height:85vh;overflow:auto;background:var(--bg);color:var(--tx);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet label{display:block;font:700 13px 'Lora',Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);margin:14px 4px 6px}
.sheet select{width:100%;height:48px;border-radius:24px;border:1.5px solid var(--chipline);background:var(--chipbg);padding:0 16px;font-size:16px}
.sheet .tog{display:flex;align-items:center;gap:12px;min-height:44px;text-transform:none;letter-spacing:0;font:400 16px 'Lora',Georgia,serif;color:var(--tx)}
.tog input{width:24px;height:24px;accent-color:var(--gold)}
.row2{display:flex;gap:10px;margin-top:20px}.row2 .btn{flex:1}
.btn{min-height:56px;padding:0 24px;border-radius:28px;font:700 18px var(--ttl);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sm{min-height:44px;padding:0 20px;border-radius:22px;font:700 15px 'Lora',Georgia,serif;letter-spacing:0;text-transform:none}
.btn.gold{background:var(--gold);color:var(--night)}
.btn.ghost{border:1.5px solid var(--chipline);color:var(--tx)}
/* detail (always dark, like the brand board) */
.detail{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--app);background:var(--bg);color:var(--tx);z-index:30;overflow:auto;display:flex;flex-direction:column}
.hero{position:relative;flex:none;height:340px;display:flex;align-items:center;justify-content:center;
 background:repeating-conic-gradient(from -90deg at 50% 100%,rgba(228,168,38,.16) 0deg 4deg,rgba(228,168,38,0) 4deg 12deg),radial-gradient(ellipse at 50% 100%,#6A1FA8 0%,#3D0F6B 55%,#2A0A4A 100%)}
.hero img{width:290px;max-width:76%;height:auto}
.back{position:absolute;left:16px;top:calc(20px + env(safe-area-inset-top));width:48px;height:48px;border-radius:24px;border:1px solid rgba(228,168,38,.4);background:rgba(30,8,54,.7);color:var(--gold);display:grid;place-items:center}
.back svg{width:24px;height:24px}
.dbody{padding:24px 24px 28px;display:flex;flex-direction:column;gap:14px;flex:1}
.dbody .pill{height:30px;padding:0 14px;border-radius:15px;font-size:13px}
.dbody h1{margin:0;font:600 34px/1.1 var(--ttl);color:var(--cream);overflow-wrap:anywhere}
.lead{margin:0;color:var(--tx2);line-height:1.55}
.fact{display:flex;align-items:center;gap:14px}.fact svg{width:24px;height:24px;color:var(--gold)}
.more{margin-top:8px;border-top:1px solid var(--line)}
.r{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.r svg{width:24px;height:24px;color:var(--gold);margin-top:2px}
.r small,dt{display:block;font:700 13px 'Lora',Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.r a{color:var(--orc)}
details{margin-top:6px}summary{font:700 13px 'Lora',Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);min-height:44px;display:flex;align-items:center;cursor:pointer}
dl{margin:0}dt{margin-top:10px}dd{margin:0;overflow-wrap:anywhere}
.foot{position:sticky;bottom:0;display:flex;align-items:center;gap:18px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:var(--night);border-top:1px solid rgba(228,168,38,.25)}
.foot small{display:block;font-size:13px;color:var(--tx2)}
.foot b{display:block;font:700 24px var(--ttl);color:var(--gold);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot .btn{flex:1}
/* map (always dark) */
#mapwrap{overflow:hidden;position:fixed;top:0;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:var(--app);z-index:10;color:var(--tx)}
#map{position:absolute;inset:0;background:#2A0A4A}
.lbl{background:none;border:0;white-space:nowrap;font:600 11px 'Lora',Georgia,serif;letter-spacing:.08em;text-transform:uppercase;color:#9F86C0;text-shadow:0 0 4px #2A0A4A,0 0 4px #2A0A4A}
.lbl span{display:block;transform:translate(-50%,-50%)}
.lbl.big{font:600 13px var(--ttl);color:#CDB8E6;letter-spacing:.1em}
/* bell, actions, "For you" */
.bell{position:relative;width:44px;height:44px;flex:none;border-radius:22px;border:1.5px solid var(--chipline);background:var(--chipbg);color:var(--acc);display:grid;place-items:center}
.bell svg{width:22px;height:22px}
.bell b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--gold);color:var(--night);font:700 12px/20px 'Lora',Georgia,serif;text-align:center}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.act{flex:1;min-width:140px;min-height:48px;padding:0 16px;border-radius:24px;border:1.5px solid rgba(228,168,38,.5);color:var(--cream);display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px 'Lora',Georgia,serif}
.act svg{width:22px;height:22px;color:var(--gold)}
.act.on{background:var(--gold);border-color:var(--gold);color:var(--night)}.act.on svg{color:var(--night)}
.pill.gb{border-color:var(--gold);color:var(--acc)}
.you{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--app);background:var(--bg);color:var(--tx);z-index:30;overflow:auto;padding:0 16px 32px}
.you .who{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:24px;background:var(--card);border:2px solid var(--line)}
.you .who svg{width:28px;height:28px;color:var(--gold)}.you .sub{color:var(--tx2)}
.you .hint{color:var(--tx2);margin:0 4px 12px}
.mtop{position:absolute;top:0;left:0;right:0;z-index:1000;padding:calc(20px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(rgba(42,10,74,.92) 55%,transparent)}
.mtop .bar{display:flex;gap:10px;align-items:center}.mtop .search{flex:1;margin:0}
.mtop .search input{border:1.5px solid var(--gold)}
.mtop .search{max-width:none}
.mtop .chips{margin:12px -16px 0}
.sym{width:44px;height:44px;object-fit:contain;flex:none}
.sugg{margin:8px 0 0 54px;background:var(--card);border-radius:20px;border:1px solid rgba(228,168,38,.4);overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;padding:10px 16px;min-height:44px;border-bottom:1px solid var(--line)}
.sugg small{color:var(--tx2)}
.mcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:1000;padding:14px 14px 14px 16px;border-radius:26px;background:var(--ame);border:1px solid rgba(228,168,38,.35);box-shadow:0 10px 30px rgba(30,8,54,.5)}
.mc{display:flex;align-items:center;gap:14px}
.mi{width:56px;height:56px;flex:none;border-radius:16px;background:var(--gold);color:var(--night);display:grid;place-items:center}.mi svg{width:28px;height:28px}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mt b{font:600 20px/1.2 var(--ttl);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt span{font-size:14px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm{display:block;margin-top:10px;color:var(--orc)}
.pinw{background:none;border:0}
.pin{position:relative}.pin svg{display:block;width:100%;height:100%;position:relative}
.pin i{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;bottom:-3px;width:24px;height:8px;background:rgba(30,8,54,.65)}
.pin.sel i{bottom:-8px;width:70px;height:20px;background:none;border:2px solid rgba(228,168,38,.55)}
.pin.live i{bottom:-6px;width:64px;height:18px;background:none;border:2px solid rgba(196,124,232,.5)}
.clu{width:62px;height:62px;border-radius:31px;background:rgba(228,168,38,.28);display:grid;place-items:center}
.clu b{width:44px;height:44px;border-radius:22px;background:var(--gold);color:var(--night);display:grid;place-items:center;font:700 18px var(--ttl)}
.leaflet-control-attribution{font-size:10px}.leaflet-container{font:inherit}
/* responsive: phone stays as designed; tablets and computers get room */
.grid{display:grid;grid-template-columns:1fr;gap:12px}.grid .card{margin:0;height:100%}
@media (min-width:760px){
 :root{--app:min(100vw,1180px)}
 body{font-size:17px}
 #app{max-width:var(--app);padding:0 32px calc(120px + env(safe-area-inset-bottom))}
 header{margin:0 -32px;padding:calc(28px + env(safe-area-inset-top)) 32px 16px;gap:14px}
 header h1{font-size:40px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
 .chips{margin:0 -32px;padding:2px 32px 10px}
 .search{max-width:640px}
 .cb .ct{font-size:18px}
 h2{font-size:14px;margin:30px 4px 14px}
 .nav{width:min(620px,calc(100vw - 32px));bottom:calc(16px + env(safe-area-inset-bottom));height:76px;padding:6px 10px;border-radius:38px;border:1px solid var(--navline);box-shadow:0 12px 40px rgba(30,8,54,.35)}
 .nav button{font-size:13px}
 .detail{width:min(100vw,760px);box-shadow:0 0 0 100vmax rgba(30,8,54,.6)}
 .hero{height:400px}.hero img{width:330px}
 .dbody{padding:32px 40px}.dbody h1{font-size:44px}
 .you{width:min(100vw,1000px);padding:0 32px 40px;box-shadow:0 0 0 100vmax rgba(30,8,54,.6)}
 .you header{margin:0 -32px}
 .veil{align-items:center}.sheet{width:min(560px,calc(100vw - 32px));border-radius:24px}
 #mapwrap{width:100vw;bottom:0}
 .mtop{padding:calc(24px + env(safe-area-inset-top)) 32px 0}.mtop .bar{max-width:720px}.mtop .chips{margin:12px -32px 0}
 .mcard{left:32px;right:auto;width:440px;bottom:116px}
}
@media (min-width:1280px){header h1{font-size:46px}}
/* splash */
#splash{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#4A1680,#1E0836 70%);z-index:99;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;transition:opacity .5s}
#splash img{max-width:62%;max-height:46vh;width:auto;height:auto}
#splash p{margin:0;font:600 18px var(--ttl);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
#splash.out{opacity:0;pointer-events:none}

/* ================= Art Deco catalogue =================
   A printed weekly catalogue: dark masthead band with the logo, numbered entries in gold double-rule frames
   with corner blocks, octagonal medallions, ticket-cut tags, chapter ornaments, dotted-leader spec lists. */
:root{--rule:var(--ogold);--fan:rgba(176,125,18,.10);--card:#FFFBEE;--tagbg:#F3E5BF;--deco:'Cinzel Decorative','Cinzel',Georgia,serif;
 --goldbar:linear-gradient(180deg,#F4CB5C 0%,#E4A826 48%,#B07D12 100%)}
.dk{--rule:var(--gold);--fan:rgba(228,168,38,.07);--card:#3D0F6B;--tagbg:rgba(228,168,38,.14)}
#app{background-color:var(--bg);
 background-image:radial-gradient(circle at 50% 100%,transparent 0 7px,var(--fan) 7px 8px,transparent 8px 12px,var(--fan) 12px 13px,transparent 13px 17px,var(--fan) 17px 18px,transparent 18px),
  radial-gradient(circle at 50% 100%,transparent 0 7px,var(--fan) 7px 8px,transparent 8px 12px,var(--fan) 12px 13px,transparent 13px 17px,var(--fan) 17px 18px,transparent 18px);
 background-size:36px 18px;background-position:0 0,18px 9px}
:focus-visible{outline:2px solid var(--orc);outline-offset:2px}
/* masthead */
.mast{position:relative;top:auto;display:block;margin:0 -16px 26px;padding:calc(12px + env(safe-area-inset-top)) 20px 26px;text-align:center;color:var(--cream);
 background:repeating-conic-gradient(from -90deg at 50% 100%,rgba(228,168,38,.13) 0 3deg,transparent 3deg 9deg),radial-gradient(ellipse at 50% 100%,#6A1FA8 0%,#3D0F6B 50%,#1E0836 100%);
 border-bottom:4px double var(--gold)}
.mast::before{content:'';position:absolute;inset:8px 8px 10px;border:1px solid rgba(228,168,38,.35);pointer-events:none}
.mast::after{content:'';position:absolute;left:50%;bottom:-13px;width:18px;height:18px;transform:translateX(-50%) rotate(45deg);background:var(--gold);box-shadow:0 0 0 4px var(--bg)}
.mtools{position:relative;display:flex;justify-content:space-between;align-items:center;z-index:1}
.mast .lang,.mast .bell{border-radius:0;border:1px solid rgba(228,168,38,.55);background-color:rgba(30,8,54,.55);color:var(--gold);background-image:linear-gradient(var(--rule),var(--rule)),linear-gradient(var(--rule),var(--rule));background-size:6px 6px;background-repeat:no-repeat;background-position:0 0,100% 100%}
.mast .bell b{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);min-width:22px;height:22px;line-height:22px;top:0;right:0;font-family:var(--ttl)}
.mlogo{display:block;height:128px;width:auto;max-width:70%;margin:-30px auto 6px}
.msym{display:block;height:58px;width:auto;margin:-34px auto 6px}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;font:600 11px var(--ttl);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.eyebrow::before,.eyebrow::after{content:'';flex:0 1 44px;height:4px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.mast h1{margin:8px 0 6px;font:700 30px/1.12 var(--deco);color:var(--cream);letter-spacing:.02em;text-wrap:balance;text-shadow:0 2px 0 #1E0836}
.issue{font:italic 15px 'Lora',Georgia,serif;color:#CDB8E6}
.issue b{font:600 12px var(--ttl);font-style:normal;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
/* chapter ornaments */
h2.orn{display:flex;align-items:center;gap:12px;margin:30px 0 16px;font:600 13px var(--ttl);letter-spacing:.24em;text-transform:uppercase;color:var(--acc);text-align:center}
h2.orn::before,h2.orn::after{content:'';flex:1;height:5px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
h2.orn span::before{content:'◆ ';color:var(--rule)}h2.orn span::after{content:' ◆';color:var(--rule)}

  const o = { hood: {}, price: {}, genre: {}, cat: {}, langF: {} }, inc = (k, v) => { if (v) o[k][v] = (o[k][v] || 0) + 1; };
  for (const x of base) { const a = attrs(x); inc('hood', a.hood); inc('price', a.price); inc('cat', a.cat); a.genres.forEach(g => inc('genre', g));
    String(a.lang).split(/[,/]/).forEach(l => inc('langF', l.trim())); }
  for (const k in o) o[k] = Object.entries(o[k]).sort((a, b) => k === 'price' ? a[0].length - b[0].length : b[1] - a[1]).slice(0, 30).map(e => e[0]);

const LANGN = { es: 'Español', en: 'English' };

/* ---------- you: saves, Golden Bananas, seen alerts ----------
   One record per person. With the link (claude.ai) it lives in the account store, private to that person;
   opened as a local file it stays on this device. */
let ME = { saved: [], bananas: [], seen: [] }, WHO = null, meRef = null, writing = Promise.resolve();
try { Object.assign(ME, JSON.parse(localStorage['cb.me'] || '{}')); } catch (e) {}
const persist = () => { store('cb.me', JSON.stringify(ME)); if (meRef) writing = writing.then(() => meRef.set(ME)).catch(() => {}); };
const toggle = (list, id) => { const a = ME[list], i = a.indexOf(id); i < 0 ? a.push(id) : a.splice(i, 1); persist(); };
const isSaved = id => ME.saved.includes(id), isBanana = id => ME.bananas.includes(id);
function alerts() {   // upcoming events + current deals at Golden Banana places
  const today = ymd(new Date()), out = [];
  for (const id of ME.bananas) { const p = BY.get(id); if (!p) continue;
    if (p._deal) out.push({ id: 'deal:' + p._id, x: p, deal: true });
    for (const e of events) if (placeFor(e) === p && evDay(e) >= today) out.push({ id: e._id, x: e }); }
  return out;
}
const unseen = () => alerts().filter(a => !ME.seen.includes(a.id)).length;
async function account() {
  if (!window.claude?.use) return;
  const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
  if (!user || !db) return;
  const id = await user.id(); if (!id) return;
  WHO = await user.me(); meRef = db.collection('data/users/' + id).doc('me');

    if (s.exists) { const d = s.data(); for (const k of ['saved', 'bananas', 'seen']) ME[k] = [...new Set([...(d[k] || []), ...ME[k]])]; }

/* ---------- dates ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const evDay = e => { const s = String(e._date || ''), m = s.match(/^(\d{4})-(\d\d)-(\d\d)/) || s.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{2,4})/);
  if (!m) { const d = new Date(s); return isNaN(d) ? '' : ymd(d); }
  return s[4] === '-' ? m[0] : `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; };
const hm = v => { const m = String(v || '').match(/(\d{1,2})(?:[:h.](\d{2}))?\s*(am|pm|a\.?m\.?|p\.?m\.?)?/i); if (!m) return null;
  let h = +m[1]; const pm = m[3] && /p/i.test(m[3]); if (pm && h < 12) h += 12; if (m[3] && !pm && h === 12) h = 0; return { h, m: +(m[2] || 0) }; };
const fmtT = v => { const x = hm(v); return x ? { t: `${x.h % 12 || 12}:${String(x.m).padStart(2, '0')}`, ap: x.h < 12 ? 'AM' : 'PM' } : { t: '—', ap: '' }; };
const liveNow = e => { const x = hm(e._time); if (!x || evDay(e) !== ymd(new Date())) return false;
  const s = new Date(); s.setHours(x.h, x.m, 0); const n = Date.now(); return n >= s && n < +s + 3 * 36e5; };
const week = [...Array(7)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i); return d; });
const loc = () => lang === 'es' ? 'es-PY' : 'en-US';

/* ---------- UI pieces ---------- */

const isoWeek = d => { const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7)); return Math.ceil(((x - Date.UTC(x.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7); };
const issue = () => { const a = week[0], b = week[6], f = (d, o) => d.toLocaleDateString(loc(), o);
  return `<b>Nº ${isoWeek(a)}</b> · ${f(a, { day: 'numeric' })}${a.getMonth() === b.getMonth() ? '' : ' ' + f(a, { month: 'long' })} – ${f(b, { day: 'numeric', month: 'long', year: 'numeric' })}`; };

const sec = (n, txt) => `<h2 class="orn"><span>${n ? n + '. ' : ''}${esc(txt)}</span></h2>`;
const no = i => i === undefined || typeof i !== 'number' ? '' : `<span class="no">Nº ${String(i + 1).padStart(3, '0')}</span>`;
const pill = (txt, cls = '') => `<span class="pill ${cls}">${esc(txt)}</span>`;
const evPills = e => (liveNow(e) ? pill(t('live'), 'live') : '') + (e._free ? pill(t('free'), 'free') : '') + (/^https?:/i.test(e._ticket) ? pill(t('tix'), 'tix') : '')
  + (e._tat ? pill('Asunción Times') : '') + (/sold out|agotad/i.test(e._status) ? pill(e._status, 'out') : has(e._status) && !/confirm/i.test(e._status) ? pill(e._status, 'new') : '');
const nActive = () => SEL.filter(k => F[k]).length + (F.closed ? 1 : 0);

// Only offer filters this tab can actually satisfy
const avail = () => { const base = baseFor(), as = base.map(attrs), o = options(base);
  return { bool: BOOL.filter(k => F[k] || as.some(a => a[k])), sel: SEL.filter(k => o[k].length > 1 || F[k]), closed: as.some(a => a.closed), o }; };

  const s = sel && BY.get(sel);
  w.querySelector('.mcard').innerHTML = s ? `<div class="mc"><div class="mi">${ic(s._cat)}</div><div class="mt"><b>${esc(s.Name)}</b><span>${esc([s['Type / style'], s._hood].filter(has).join(' · '))}</span></div>
    <button class="btn sm gold" onclick="detail('${s._id}')">${t('details')}</button></div>${s._lat ? '' : `<a class="gm" href="${gmaps(s)}" target="_blank" rel="noopener">${t('notOnMap')}</a>`}`
    : `<div style="text-align:center;color:var(--tx2)">${t('tapPin')}<br><i>${t('joke').map}</i></div>`;
  if (!window.L) return;
  if (!map) { map = L.map('map', { zoomControl: false, minZoom: 12, maxZoom: 18 }).setView([-25.29, -57.60], 13);
    basemap();
    layer = L.layerGroup().addTo(map); map.on('click', () => { sel = null; draw(); }); map.on('zoomend', pins); }
  pins(); setTimeout(() => map?.invalidateSize(), 0);
}
// Asunción drawn from bundled OpenStreetMap data (basemap.js): works offline and inside the published page
function basemap() {
  const B = window.BASEMAP; map.attributionControl.addAttribution('© OpenStreetMap contributors');
  if (!B) return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  const dec = a => { const r = []; for (let i = 0, y = 0, x = 0; i < a.length; i += 2) { y += a[i]; x += a[i + 1]; r.push([B.o[0] + y / B.s, B.o[1] + x / B.s]); } return r; };
  const cv = L.canvas({ padding: .5 }), opt = { renderer: cv, interactive: false };
  map.setMaxBounds([[B.o[0] - .02, B.o[1] - .02], [B.o[0] + .16, B.o[1] + .21]]);
  L.polygon(B.park.map(dec), { ...opt, stroke: false, fillColor: '#34105C', fillOpacity: 1 }).addTo(map);
  L.polygon(B.water.map(dec), { ...opt, stroke: false, fillColor: '#170530', fillOpacity: 1 }).addTo(map);
  const roads = [['minor', '#43196F', 1.4], ['mid', '#5A2A8C', 2.6], ['major', 'rgba(228,168,38,.55)', 3.6]].map(([k, c, w]) => [L.polyline(B[k].map(dec), { ...opt, color: c, weight: w, lineCap: 'round', lineJoin: 'round' }).addTo(map), w]);
  const big = L.layerGroup(), small = L.layerGroup();
  for (const [s, name, y, x] of B.label) (s ? big : small).addLayer(L.marker([B.o[0] + y / B.s, B.o[1] + x / B.s],
    { interactive: false, keyboard: false, icon: L.divIcon({ className: 'lbl' + (s ? ' big' : ''), html: '<span>' + esc(name) + '</span>', iconSize: null }) }));
  const zoom = () => { const z = map.getZoom(); roads.forEach(([l, w]) => l.setStyle({ weight: w * Math.max(.6, (z - 11) / 3) }));
    z >= 12 ? big.addTo(map) : big.remove(); z >= 14 ? small.addTo(map) : small.remove(); };
  map.on('zoomend', zoom); zoom();
}
function pins() {   // group pins closer than 56px into a gold cluster; the selected pin always stands alone
  layer.clearLayers(); const z = map.getZoom(), cells = new Map();
  for (const p of mapPlaces().filter(p => p._lat)) {
    const pt = map.project([p._lat, p._lon], z), k = p._id === sel || z >= 17 ? p._id : `${Math.floor(pt.x / 56)}:${Math.floor(pt.y / 56)}`;
    (cells.get(k) || cells.set(k, []).get(k)).push(p);
  }
  for (const g of cells.values()) {
    if (g.length === 1) { const p = g[0], on = p._id === sel, wh = on ? [62, 78] : [40, 50];
      layer.addLayer(L.marker([p._lat, p._lon], { icon: L.divIcon({ className: 'pinw', html: pinHtml(p, on), iconSize: wh, iconAnchor: [wh[0] / 2, wh[1]] }),
        zIndexOffset: on ? 1000 : 0, title: p.Name, keyboard: true }).on('click', e => { L.DomEvent.stop(e); sel = p._id; draw(); }));
    } else { const b = L.latLngBounds(g.map(p => [p._lat, p._lon]));
      layer.addLayer(L.marker(b.getCenter(), { icon: L.divIcon({ className: 'pinw', html: `<div class="clu"><b>${g.length}</b></div>`, iconSize: [62, 62], iconAnchor: [31, 31] }),
        title: g.length + ' places' }).on('click', e => { L.DomEvent.stop(e); b.getNorthEast().equals(b.getSouthWest()) ? map.setView(b.getCenter(), z + 2) : map.fitBounds(b.pad(.4)); }));
    }
  }
}
function pick(id) { const p = BY.get(id); sel = id; F.q = ''; draw(); if (p._lat) map?.setView([p._lat, p._lon], 17); }

/* ---------- boot ---------- */
draw();
account();
setTimeout(() => $('#splash')?.classList.add('out'), 1200);
setInterval(() => tab === 'feed' && !document.querySelector('.detail,.veil') && draw(), 60000); // refresh "Live now"
</script>
